[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cue-credit-routing"
version = "0.1.0"
description = "Controlled PACS comparison of cue-wise error routing, RSC, and ERM"
requires-python = ">=3.9"
dependencies = ["torch==2.8.0", "torchvision==0.23.0", "numpy==2.0.2", "Pillow==11.3.0", "gdown==5.2.0", "filelock==3.19.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [".conda", ".cache", "data", "runs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"experiment.py" = ["E402"]
"audit.py" = ["E402"]
